services:
  # PostgreSQL for Next.js app
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-guacamole_db}
      TZ: Asia/Kolkata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432' # exposed on host for debugging (optional)
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - secure-machine-network

  # VNC Desktop Service
  vnc-desktop:
    container_name: vnc-desktop
    image: consol/ubuntu-xfce-vnc:latest
    restart: unless-stopped
    networks:
      - secure-machine-network
    ports:
      - '5901:5901'
      - '6901:6901'
    environment:
      - VNC_PW=${VNC_PASSWORD:-vncpassword}
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}
      - VNC_COL_DEPTH=${VNC_COLOR_DEPTH:-24}
    volumes:
      - vnc-home:/headless
    shm_size: '2gb'

  guacd:
    container_name: guacd
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks:
      - secure-machine-network
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw
    environment:
      - LOG_LEVEL=info

  guacdb:
    container_name: guacdb
    image: mariadb:11.4
    restart: unless-stopped
    networks:
      - secure-machine-network
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: '1'
    volumes:
      - db-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  guacamole:
    container_name: guacamole
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    networks:
      - secure-machine-network
    ports:
      - '8080:8080'
    environment:
      # Guacd Configuration
      LOG_LEVEL: 'info'
      GUACD_HOSTNAME: 'guacd'
      GUACD_PORT: '4822'

      # Database Configuration
      MYSQL_HOSTNAME: ${DB_HOST}
      MYSQL_PORT: ${DB_PORT}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

      # Application Configuration
      WEBAPP_CONTEXT: 'guacamole'

      # API Configuration
      GUACAMOLE_HOME: '/etc/guacamole'

      # Security Configuration
      RESTRICT_USER_PASSWORD_CHANGE: 'false'
      ENABLE_WEBSOCKETS: 'true'
      TOTP_ENABLED: 'false'
      API_SESSION_TIMEOUT: '1200'
      API_SESSION_TIMEOUT_EXTENDED: '1800'

      # Optional: Recording and Drive Configuration
      RECORDING_SEARCH_PATH: '/record'
      DRIVE_ENABLED: 'true'
      DRIVE_PATH: '/drive'
    depends_on:
      guacdb:
        condition: service_healthy
      guacd:
        condition: service_started
      vnc-desktop:
        condition: service_started
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/guacamole/api/languages']
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js App
  app:
    container_name: guacamole-nextjs-app
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_ENV: production

    image: guacamole-nextjs-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - GUACAMOLE_API_URL=http://guacamole:8080/guacamole
      - DATABASE_URL=postgresql://postgres:1234@postgres:5432/guacamole_db
      - NEXT_PUBLIC_GUACAMOLE_URL=localhost:8080/guacamole # keep for client-side
      - NEXT_PUBLIC_WEBSOCKET_URL=ws://localhost:8080/guacamole/websocket-tunnel
    networks:
      - secure-machine-network
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      guacamole:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  db-data:
    driver: local
  vnc-home:
    driver: local
  postgres-data:
    driver: local

networks:
  secure-machine-network:
    driver: bridge

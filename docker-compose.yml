services:
  # PostgreSQL for Next.js app
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Kolkata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432' # exposed on host for debugging (optional)
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}', '-d', '${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - secure-machine-network

  # VNC Desktop Service
  vnc-desktop:
    container_name: vnc-desktop-container
    image: consol/ubuntu-xfce-vnc:latest
    restart: unless-stopped
    networks:
      - secure-machine-network
    ports:
      - '5901:5901'
      - '6901:6901'
    environment:
      - VNC_PW=${VNC_PASSWORD}
      - VNC_RESOLUTION=${VNC_RESOLUTION}
      - VNC_COL_DEPTH=${VNC_COLOR_DEPTH}
    volumes:
      - vnc-home:/headless
    shm_size: '2gb'

  guacd:
    container_name: guacd
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks:
      - secure-machine-network
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw
    environment:
      - LOG_LEVEL=info

  guac-postgres:
    image: postgres:17-alpine
    container_name: guac_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GUAC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GUAC_POSTGRES_PASSWORD}
      POSTGRES_DB: ${GUAC_POSTGRES_DB}
      TZ: Asia/Kolkata
    volumes:
      - guac-postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro # PostgreSQL init scripts
    ports:
      - '5433:5432' # optional, different host port to avoid conflict
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${GUAC_POSTGRES_USER}', '-d', '${GUAC_POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - secure-machine-network

  guacamole:
    container_name: guacamole
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    networks:
      - secure-machine-network
    ports:
      - '8080:8080'
    environment:
      # Guacd Configuration
      LOG_LEVEL: 'info'
      GUACD_HOSTNAME: 'guacd'
      GUACD_PORT: '4822'

      # Database Configuration
      POSTGRESQL_HOSTNAME: 'guac-postgres'
      POSTGRESQL_PORT: '5432'
      POSTGRESQL_DATABASE: ${GUAC_POSTGRES_DB}
      POSTGRESQL_USER: ${GUAC_POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${GUAC_POSTGRES_PASSWORD}

      # Application Configuration
      WEBAPP_CONTEXT: 'guacamole'

      # API Configuration
      GUACAMOLE_HOME: '/etc/guacamole'

      # Security Configuration
      RESTRICT_USER_PASSWORD_CHANGE: 'false'
      ENABLE_WEBSOCKETS: 'true'
      TOTP_ENABLED: 'false'
      API_SESSION_TIMEOUT: '1200'
      API_SESSION_TIMEOUT_EXTENDED: '1800'

      # Optional: Recording and Drive Configuration
      RECORDING_SEARCH_PATH: '/record'
      DRIVE_ENABLED: 'true'
      DRIVE_PATH: '/drive'
    depends_on:
      guac-postgres:
        condition: service_healthy
      guacd:
        condition: service_started
      vnc-desktop:
        condition: service_started
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/guacamole/api/languages']
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js App
  app:
    container_name: guacamole-nextjs-app
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_ENV: production

    image: guacamole-nextjs-app:latest
    restart: unless-stopped
    env_file: .env
    networks:
      - secure-machine-network
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      guacamole:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  guac-postgres-data:
    driver: local
  vnc-home:
    driver: local
  postgres-data:
    driver: local

networks:
  secure-machine-network:
    driver: bridge

services:
  # VNC Desktop Service - Ubuntu with XFCE Desktop
  vnc-desktop:
    container_name: vnc-desktop
    image: consol/ubuntu-xfce-vnc:latest
    restart: unless-stopped
    networks:
      - secure-machine-network
    ports:
      - "5901:5901" # VNC port (optional, for direct VNC client access)
      - "6901:6901" # noVNC port (optional, for browser access)
    environment:
      - VNC_PW=${VNC_PASSWORD:-vncpassword}
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}
      - VNC_COL_DEPTH=${VNC_COLOR_DEPTH:-24}
    volumes:
      - vnc-home:/headless
    shm_size: "2gb" # Shared memory for better performance

  guacd:
    container_name: guacd
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks:
      - secure-machine-network
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw
    environment:
      - LOG_LEVEL=info

  guacdb:
    container_name: guacdb
    image: mariadb:11.4
    restart: unless-stopped
    networks:
      - secure-machine-network
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  guacamole:
    container_name: guacamole
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    networks:
      - secure-machine-network
    ports:
      - "8080:8080"
    environment:
      # Guacd Configuration
      LOG_LEVEL: "info"
      GUACD_HOSTNAME: "guacd"
      GUACD_PORT: "4822"

      # Database Configuration
      MYSQL_HOSTNAME: ${DB_HOST}
      MYSQL_PORT: ${DB_PORT}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

      # Application Configuration
      WEBAPP_CONTEXT: "guacamole"

      # API Configuration
      GUACAMOLE_HOME: "/etc/guacamole"

      # Security Configuration
      RESTRICT_USER_PASSWORD_CHANGE: "false"
      ENABLE_WEBSOCKETS: "true"
      TOTP_ENABLED: "false"
      API_SESSION_TIMEOUT: "1200"
      API_SESSION_TIMEOUT_EXTENDED: "1800"

      # Optional: Recording and Drive Configuration
      RECORDING_SEARCH_PATH: "/record"
      DRIVE_ENABLED: "true"
      DRIVE_PATH: "/drive"

    depends_on:
      guacdb:
        condition: service_healthy
      guacd:
        condition: service_started
      vnc-desktop:
        condition: service_started
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8080/guacamole/api/languages"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Uncomment when ready to deploy Next.js app in Docker
  # app:
  #   container_name: guacamole-nextjs-app
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   networks:
  #     - secure-machine-network
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=production
  #     - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/guacamole_db
  #     - GUACAMOLE_API_URL=http://guacamole:8080/guacamole
  #     - GUACAMOLE_WEBSOCKET_URL=ws://guacamole:8080/guacamole/websocket-tunnel
  #     - GUACAMOLE_API_USERNAME=${GUACAMOLE_API_USERNAME}
  #     - GUACAMOLE_API_PASSWORD=${GUACAMOLE_API_PASSWORD}
  #     - NEXT_PUBLIC_GUACAMOLE_URL=${NEXT_PUBLIC_GUACAMOLE_URL}
  #     - NEXT_PUBLIC_WEBSOCKET_URL=${NEXT_PUBLIC_WEBSOCKET_URL}
  #   depends_on:
  #     - guacdb
  #     - guacamole

volumes:
  db-data:
    driver: local
  vnc-home:
    driver: local

networks:
  secure-machine-network:
    driver: bridge

services:
  # VNC Desktop Service - Ubuntu with XFCE Desktop
  vnc-desktop:
    container_name: vnc-desktop
    image: consol/ubuntu-xfce-vnc:latest
    restart: unless-stopped
    networks:
      - guacamole-network
    ports:
      - '5901:5901' # VNC port (optional, for direct VNC client access)
      - '6901:6901' # noVNC port (optional, for browser access)
    environment:
      - VNC_PW=${VNC_PASSWORD:-vncpassword}
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}
      - VNC_COL_DEPTH=${VNC_COLOR_DEPTH:-24}
    volumes:
      - vnc-home:/headless
    shm_size: '2gb' # Shared memory for better performance

  guacd:
    container_name: guacd
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks:
      - guacamole-network
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw
    environment:
      - LOG_LEVEL=info

  guacdb:
    container_name: guacdb
    image: mariadb:11.4
    restart: unless-stopped
    networks:
      - guacamole-network
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-GuacamoleRootPassword}
      MARIADB_DATABASE: ${DB_NAME:-guacamole_db}
      MARIADB_USER: ${DB_USER:-guacamole_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-GuacamoleUserPassword}
      MARIADB_AUTO_UPGRADE: '1'
    volumes:
      - db-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  guacamole-api:
    container_name: guacamole-api
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    networks:
      - guacamole-network
    ports:
      - '8080:8080'
    environment:
      # Guacd Configuration
      LOG_LEVEL: 'info'
      GUACD_HOSTNAME: 'guacd'
      GUACD_PORT: '4822'

      # Database Configuration
      MYSQL_HOSTNAME: ${DB_HOST:-guacdb}
      MYSQL_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${DB_NAME:-guacamole_db}
      MYSQL_USER: ${DB_USER:-guacamole_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-GuacamoleUserPassword}

      # Application Configuration
      WEBAPP_CONTEXT: 'guacamole'

      # API Configuration
      GUACAMOLE_HOME: '/etc/guacamole'

      # Security Configuration
      ENABLE_WEBSOCKETS: 'true'
      TOTP_ENABLED: 'false'

      # Optional: Recording and Drive Configuration
      RECORDING_SEARCH_PATH: '/record'
      DRIVE_ENABLED: 'true'
      DRIVE_PATH: '/drive'

    depends_on:
      guacdb:
        condition: service_healthy
      guacd:
        condition: service_started
      vnc-desktop:
        condition: service_started
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/guacamole/']
      interval: 30s
      timeout: 10s
      retries: 3

  # Uncomment when ready to deploy Next.js app in Docker
  # app:
  #   container_name: guacamole-nextjs-app
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
